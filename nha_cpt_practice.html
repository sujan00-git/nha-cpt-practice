<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NHA CPT Practice Exam</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #1e5aa8;
    --primary-dark: #164480;
    --accent: #0b8a5a;
    --wrong: #c0392b;
    --right: #1e8449;
    --muted: #6b7280;
    --border: #e2e6ee;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #222;
    margin: 0;
    padding: 20px;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    background: var(--primary);
    color: white;
    padding: 20px 24px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header .meta { font-size: 14px; opacity: 0.9; }
  .toolbar {
    background: #fff;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  button.secondary:hover { background: #eef3fb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress {
    margin-left: auto;
    font-size: 14px;
    color: var(--muted);
  }
  main {
    background: var(--card);
    padding: 24px;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    min-height: 400px;
  }
  .question {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .question:last-child { border-bottom: none; }
  .q-header {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .q-num {
    font-weight: 700;
    color: var(--primary);
    min-width: 32px;
  }
  .q-text { font-weight: 500; }
  .options { margin: 10px 0 0 42px; }
  .option {
    display: block;
    padding: 8px 12px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .option:hover { background: #f0f4fa; }
  .option input { margin-right: 10px; }
  .option.correct {
    background: #e6f6ed;
    border-color: var(--right);
  }
  .option.wrong {
    background: #fbe9e7;
    border-color: var(--wrong);
  }
  .option.correct-missed {
    background: #e6f6ed;
    border-color: var(--right);
    border-style: dashed;
  }
  .result-badge {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .result-badge.right { background: var(--right); color: #fff; }
  .result-badge.wrong { background: var(--wrong); color: #fff; }
  .domain {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 4px;
    margin-left: 42px;
  }
  .score-card {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 24px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
  }
  .score-card .big {
    font-size: 48px;
    font-weight: 700;
    margin: 10px 0;
  }
  .score-card .pass { color: #a8f0c6; }
  .score-card .fail { color: #ffc7c0; }
  .domain-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .domain-stat {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .domain-stat .num { font-size: 20px; font-weight: 700; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 16px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
    padding: 10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NHA CPT Practice Exam</h1>

  </header>
  <div class="toolbar">
    <button id="newBtn">New Test</button>

  <main id="main">
    <div class="empty">Click <b>New Test</b> to begin.</div>
  </main>
  <footer>Study aid only &mdash; questions are representative, not official NHA content.</footer>
</div>

// ============================================================
// App state
// ============================================================
let currentSet = [];
let graded = false;

// The first CORE_COUNT questions in QUESTIONS are the high-yield "core"
// questions that are most commonly tested on the real exam.
// First 10 runs will be weighted toward these; after that they still appear
// mixed in with the broader bank so you keep reinforcing them.
const CORE_COUNT = 180;
const EARLY_RUNS = 10;

const main = document.getElementById('main');
const newBtn = document.getElementById('newBtn');
const submitBtn = document.getElementById('submitBtn');
const revealBtn = document.getElementById('revealBtn');
const progressEl = document.getElementById('progress');

function getRunCount() {
  return parseInt(localStorage.getItem('nhaCptRunCount') || '0', 10);
}
function incrementRunCount() {
  const n = getRunCount() + 1;
  localStorage.setItem('nhaCptRunCount', String(n));
  return n;
}

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function pickRandom(n) {
  const run = getRunCount() + 1; // the run we're about to show
  const core = QUESTIONS.slice(0, Math.min(CORE_COUNT, QUESTIONS.length));
  const extra = QUESTIONS.slice(Math.min(CORE_COUNT, QUESTIONS.length));

  let coreTarget;
  if (run <= EARLY_RUNS) {
    // First 10 runs: ~75% core, ~25% other to introduce variety
    coreTarget = Math.round(n * 0.75);
  } else {
    // After 10 runs: ~30% core (keep reinforcing), ~70% broader bank
    coreTarget = Math.round(n * 0.30);
  }
  coreTarget = Math.min(coreTarget, core.length);
  const extraTarget = n - coreTarget;

  const picked = [
    ...shuffle([...core]).slice(0, coreTarget),
    ...shuffle([...extra]).slice(0, extraTarget)
  ];
  // Final shuffle so core/non-core are mixed in question order
  return shuffle(picked);
}

function renderTest() {
  graded = false;
  revealBtn.disabled = true;
  submitBtn.disabled = false;
  let html = '';
  currentSet.forEach((item, idx) => {
    html += `<div class="question" data-idx="${idx}">
      <div class="q-header">
        <div class="q-num">${idx + 1}.</div>
        <div class="q-text">${escapeHtml(item.q)}</div>
      </div>
      <div class="options">
        ${item.choices.map((c, i) => `
          <label class="option" data-choice="${i}">
            <input type="radio" name="q${idx}" value="${i}">
            <b>${String.fromCharCode(65 + i)}.</b> ${escapeHtml(c)}
          </label>
        `).join('')}
      </div>
      <div class="domain">Domain: ${domainName(item.domain)}</div>
    </div>`;
  });
  main.innerHTML = html;
  updateProgress();
  main.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('change', updateProgress);
  });
}

function updateProgress() {
  if (!currentSet.length) {
    progressEl.textContent = '';
    return;
  }
  const answered = currentSet.filter((_, i) => {
    return document.querySelector(`input[name="q${i}"]:checked`);
  }).length;
  progressEl.textContent = `Answered ${answered} / ${currentSet.length}`;
}

function gradeTest() {
  if (!currentSet.length) return;
  let correct = 0;
  const domainStats = {};
  currentSet.forEach((item, idx) => {
    const selected = document.querySelector(`input[name="q${idx}"]:checked`);
    const userAns = selected ? parseInt(selected.value) : -1;
    const isRight = userAns === item.answer;
    if (isRight) correct++;
    if (!domainStats[item.domain]) domainStats[item.domain] = { right: 0, total: 0 };
    domainStats[item.domain].total++;
    if (isRight) domainStats[item.domain].right++;

    const qDiv = main.querySelector(`.question[data-idx="${idx}"]`);
    const labels = qDiv.querySelectorAll('.option');
    labels.forEach(lbl => {
      const choice = parseInt(lbl.dataset.choice);
      lbl.querySelector('input').disabled = true;
      if (choice === item.answer) {
        lbl.classList.add(choice === userAns ? 'correct' : 'correct-missed');
      } else if (choice === userAns) {
        lbl.classList.add('wrong');
      }
    });
    const qHeader = qDiv.querySelector('.q-header');
    const badge = document.createElement('span');
    badge.className = 'result-badge ' + (isRight ? 'right' : 'wrong');
    badge.textContent = isRight ? 'Correct' : (userAns === -1 ? 'Skipped' : 'Incorrect');
    qHeader.appendChild(badge);
  });

  const pct = Math.round((correct / currentSet.length) * 100);
  const pass = pct >= 75;
  const scoreHtml = `
    <div class="score-card">
      <div style="font-size:14px; opacity:0.85;">YOUR SCORE</div>
      <div class="big ${pass ? 'pass' : 'fail'}">${correct} / ${currentSet.length} &nbsp; (${pct}%)</div>
      <div>${pass ? 'Pass — keep practicing!' : 'Below 75% — review the missed items.'}</div>
      <div class="domain-breakdown">
        ${Object.entries(domainStats).map(([d, s]) => `
          <div class="domain-stat">
            <div>${domainName(d)}</div>
            <div class="num">${s.right}/${s.total}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
  main.insertAdjacentHTML('afterbegin', scoreHtml);
  graded = true;
  submitBtn.disabled = true;
  revealBtn.disabled = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswerKey() {
  if (!currentSet.length) return;
  let html = '<div class="score-card"><div style="font-size:18px; font-weight:700;">Answer Key</div></div>';
  html += '<ol style="line-height:1.8;">';
  currentSet.forEach(item => {
    const letter = String.fromCharCode(65 + item.answer);
    html += `<li><b>${escapeHtml(item.q)}</b><br>
      <span style="color:#1e8449;"><b>Answer: ${letter}.</b> ${escapeHtml(item.choices[item.answer])}</span>
      <div class="domain" style="margin-left:0;">Domain: ${domainName(item.domain)}</div></li>`;
  });
  html += '</ol>';
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function domainName(code) {
  return {
    SC: "Safety & Compliance",
    PP: "Patient Prep",
    RC: "Routine Collections",
    SP: "Special Collections",
    PR: "Processing"
  }[code] || code;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

newBtn.addEventListener('click', () => {
  if (!graded && currentSet.length && !confirm('Start a new test? Your current answers will be lost.')) return;
  currentSet = pickRandom(20);
  const run = incrementRunCount();
  renderTest();
  const mode = run <= EARLY_RUNS
    ? `Run #${run} of ${EARLY_RUNS} early runs — weighted toward high-yield core topics`
    : `Run #${run} — core topics still mixed in for reinforcement`;
  progressEl.textContent = mode;
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

document.addEventListener('DOMContentLoaded', () => {
  const run = getRunCount();
  if (run > 0) {
    progressEl.textContent = `You have completed ${run} test run${run === 1 ? '' : 's'}. Click New Test to begin.`;
  }
});

submitBtn.addEventListener('click', () => {
  if (!currentSet.length) {
    alert('Click "New Test" to start first.');
    return;
  }
  if (graded) return;
  const answered = currentSet.filter((_, i) => document.querySelector(`input[name="q${i}"]:checked`)).length;
  if (answered < currentSet.length) {
    if (!confirm(`You answered ${answered} of ${currentSet.length}. Grade anyway?`)) return;
  }
  gradeTest();
});

revealBtn.addEventListener('click', showAnswerKey);
</script>

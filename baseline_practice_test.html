<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NHA CPT Baseline Practice Test</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --primary: #0b8a5a;
    --primary-dark: #086c47;
    --accent: #1e5aa8;
    --wrong: #c0392b;
    --right: #1e8449;
    --muted: #6b7280;
    --border: #e2e6ee;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: #222;
    margin: 0;
    padding: 20px;
    line-height: 1.5;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  header {
    background: var(--primary);
    color: white;
    padding: 20px 24px;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 { margin: 0; font-size: 22px; }
  header .meta { font-size: 14px; opacity: 0.92; }
  .toolbar {
    background: #fff;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  button {
    background: var(--primary);
    color: white;
    border: none;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.15s;
  }
  button:hover { background: var(--primary-dark); }
  button.secondary {
    background: #fff;
    color: var(--primary);
    border: 1px solid var(--primary);
  }
  button.secondary:hover { background: #e9f5ef; }
  button.ghost {
    background: #fff;
    color: var(--accent);
    border: 1px solid var(--accent);
  }
  button.ghost:hover { background: #eef3fb; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .progress {
    margin-left: auto;
    font-size: 14px;
    color: var(--muted);
  }
  main {
    background: var(--card);
    padding: 24px;
    border-radius: 0 0 10px 10px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    min-height: 400px;
  }
  .question {
    margin-bottom: 24px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .question:last-child { border-bottom: none; }
  .q-header {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }
  .q-num {
    font-weight: 700;
    color: var(--primary);
    min-width: 32px;
  }
  .q-text { font-weight: 500; }
  .options { margin: 10px 0 0 42px; }
  .option {
    display: block;
    padding: 8px 12px;
    margin: 6px 0;
    border: 1px solid var(--border);
    border-radius: 6px;
    cursor: pointer;
    transition: background 0.1s;
  }
  .option:hover { background: #eef7f1; }
  .option input { margin-right: 10px; }
  .option.correct {
    background: #e6f6ed;
    border-color: var(--right);
  }
  .option.wrong {
    background: #fbe9e7;
    border-color: var(--wrong);
  }
  .option.correct-missed {
    background: #e6f6ed;
    border-color: var(--right);
    border-style: dashed;
  }
  .result-badge {
    display: inline-block;
    margin-left: 10px;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 700;
  }
  .result-badge.right { background: var(--right); color: #fff; }
  .result-badge.wrong { background: var(--wrong); color: #fff; }
  .domain {
    font-size: 11px;
    text-transform: uppercase;
    color: var(--muted);
    letter-spacing: 0.5px;
    margin-top: 4px;
    margin-left: 42px;
  }
  .score-card {
    background: linear-gradient(135deg, var(--primary), var(--primary-dark));
    color: white;
    padding: 24px;
    border-radius: 10px;
    margin-bottom: 20px;
    text-align: center;
  }
  .score-card .big {
    font-size: 48px;
    font-weight: 700;
    margin: 10px 0;
  }
  .score-card .pass { color: #a8f0c6; }
  .score-card .fail { color: #ffc7c0; }
  .domain-breakdown {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 10px;
    margin-top: 16px;
  }
  .domain-stat {
    background: rgba(255,255,255,0.15);
    padding: 10px;
    border-radius: 6px;
    font-size: 13px;
  }
  .domain-stat .num { font-size: 20px; font-weight: 700; }
  .empty {
    text-align: center;
    color: var(--muted);
    padding: 60px 20px;
    font-size: 16px;
  }
  footer {
    text-align: center;
    color: var(--muted);
    font-size: 12px;
    margin-top: 20px;
    padding: 10px;
  }
  .test-id {
    font-family: monospace;
    font-size: 12px;
    color: #ddefdd;
    margin-top: 4px;
  }
  .history-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .history-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 8px;
    background: #fafbfd;
  }
  .history-item .hi-meta { font-size: 13px; color: var(--muted); }
  .history-item .hi-title { font-weight: 600; color: #222; }
  .history-item .hi-score {
    font-weight: 700;
    padding: 4px 10px;
    border-radius: 10px;
    font-size: 13px;
    background: #e2e8f0;
    color: #334155;
  }
  .history-item .hi-score.pass { background: #c8ead6; color: #0b6b3b; }
  .history-item .hi-score.fail { background: #f5cbc4; color: #8e1a1a; }
  .history-item .hi-score.ungraded { background: #e5e7eb; color: #4b5563; }
  .history-actions { display: flex; gap: 6px; }
  .history-actions button { padding: 6px 10px; font-size: 12px; }
  .coverage {
    padding: 10px 24px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }
  .coverage .cov-text { flex: 1; }
  .coverage .cov-text strong { color: #222; }
  .coverage.done {
    background: #e6f6ed;
    color: #0b6b3b;
    border-bottom-color: #a8d5bb;
    font-size: 14px;
  }
  .coverage.done .cov-text strong { color: #0b6b3b; }
  .coverage .link-btn {
    background: none;
    border: none;
    color: inherit;
    text-decoration: underline;
    padding: 0;
    font-size: inherit;
    cursor: pointer;
    font-weight: 600;
  }
  .coverage .link-btn:hover { background: none; opacity: 0.8; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>NHA CPT Baseline Practice Test</h1>
      <div class="meta">Questions drawn from the baseline Focused-Review PDFs &mdash; 25 per test, random each run.</div>
      <div style="margin-top:8px; font-size:13px;">
        <a href="index.html" style="color:#eafff5; text-decoration:underline;">&larr; Back to Index</a>
      </div>
      <div class="test-id" id="testIdLabel"></div>
    </div>
  </header>
  <div class="toolbar">
    <button id="newBtn">New Test</button>
    <button id="submitBtn" class="secondary">Submit &amp; Grade</button>
    <button id="revealBtn" class="secondary" disabled>Show Answer Key</button>
    <button id="downloadBtn" class="ghost" disabled>Download Test</button>
    <button id="historyBtn" class="ghost">Past Tests</button>
    <button id="exportBtn" class="ghost">Export All</button>
    <button id="importBtn" class="ghost">Import</button>
    <span class="progress" id="progress"></span>
  </div>
  <div id="coverage" class="coverage"></div>
  <main id="main">
    <div class="empty">Click <b>New Test</b> to begin a 25-question practice set.</div>
  </main>
  <footer>Study aid only &mdash; questions are representative, derived from the baseline NHA CPT Focused-Review PDFs.</footer>
</div>

<script>
// ============================================================
// Baseline question bank. Each question: { q, choices (A-D), answer (index 0-3), domain }
// Domains: SC = Safety/Compliance, PP = Patient Prep,
//          RC = Routine Collections, SP = Special Collections, PR = Processing
// Content drawn from practice-test-baseline/*.pdf
// ============================================================
const QUESTIONS = [
  // ========== SAFETY & COMPLIANCE (SC) ==========
  { q:"The acronym PASS for using a fire extinguisher stands for:",
    choices:["Push, Aim, Spray, Stop","Pull, Aim, Squeeze, Sweep","Pull, Approach, Spray, Secure","Push, Approach, Squeeze, Sweep"],
    answer:1, domain:"SC" },
  { q:"In the fire-response acronym RACE, the \"R\" stands for:",
    choices:["Report the fire","Rescue others who are in danger","Run from the building","Review the exit plan"],
    answer:1, domain:"SC" },
  { q:"Place the RACE fire-response steps in order:",
    choices:["Alarm, Rescue, Confine, Extinguish","Rescue, Alarm, Confine, Extinguish","Rescue, Confine, Alarm, Extinguish","Confine, Rescue, Alarm, Extinguish"],
    answer:1, domain:"SC" },
  { q:"NIOSH is a component of which larger federal agency?",
    choices:["OSHA","FDA","CDC (within DHHS)","CMS"],
    answer:2, domain:"SC" },
  { q:"A safe laboratory work environment is mandated by the Occupational Safety and Health Act and enforced by:",
    choices:["CDC","OSHA","FDA","The Joint Commission"],
    answer:1, domain:"SC" },
  { q:"Which of the following is a general OSHA laboratory safety rule for phlebotomists?",
    choices:["Keep nails short with no polish or artificial nails","Wear sandals for comfort","Chew gum to stay alert","Keep the lab coat unbuttoned for ventilation"],
    answer:0, domain:"SC" },
  { q:"When wearing a lab coat in a laboratory, you should:",
    choices:["Wear it to lunch and on breaks","Remove it when leaving the lab","Leave it unbuttoned so it is easy to remove","Wear it home to be ready for the next shift"],
    answer:1, domain:"SC" },
  { q:"Drawing blood from a patient receiving radiation therapy is an example of which hazard type?",
    choices:["Biological","Chemical","Radiation","Electrical"],
    answer:2, domain:"SC" },
  { q:"Blood, tissue, and other body fluids are examples of which laboratory hazard?",
    choices:["Chemical","Biological","Radiation","Fire"],
    answer:1, domain:"SC" },
  { q:"Which organization publishes National Patient Safety Goals (NPSGs) each year?",
    choices:["CLSI","CDC","The Joint Commission (TJC)","OSHA"],
    answer:2, domain:"SC" },
  { q:"The CLSI primarily focuses on:",
    choices:["Enforcing hospital accreditation","Developing standards to improve medical laboratory testing","Regulating medications","Vaccinating health care workers"],
    answer:1, domain:"SC" },
  { q:"The CDC’s standards for phlebotomists primarily focus on:",
    choices:["Billing and insurance","Infection control, sharps safety, and universal precautions","Lab equipment pricing","Marketing health services"],
    answer:1, domain:"SC" },
  { q:"The minimum number of patient identifiers that must be verified before a procedure is:",
    choices:["One","Two","Three","Four"],
    answer:1, domain:"SC" },
  { q:"Aseptic technique is defined as:",
    choices:["Cleaning only after a procedure","A practice used to reduce the chance of microbial contamination","Sterilizing the patient","Reusing supplies safely"],
    answer:1, domain:"SC" },
  { q:"In the FAST stroke-recognition acronym, the \"F\" stands for:",
    choices:["Falling","Face drooping","Fever","Fatigue"],
    answer:1, domain:"SC" },
  { q:"The appropriate first-aid response to syncope during a draw is to:",
    choices:["Finish the draw quickly","Stop the procedure, loosen tight clothing, apply a cold compress, keep the patient reclined","Have the patient stand up and walk","Give the patient food immediately"],
    answer:1, domain:"SC" },
  { q:"If a patient shows signs of shock (pale, cold, clammy skin, rapid pulse), the phlebotomist should:",
    choices:["Elevate the patient’s legs so the head is lower than the body and keep them lying down","Sit the patient up quickly","Offer food","Walk them to a chair"],
    answer:0, domain:"SC" },
  { q:"If blood collected during venipuncture is bright cherry red and filling the tube with force, the phlebotomist should suspect:",
    choices:["Normal venous blood","Hemolyzed blood","An accidental artery puncture","A clotted sample"],
    answer:2, domain:"SC" },
  { q:"After an accidental arterial puncture, pressure should be applied to the site for:",
    choices:["30 seconds","2 minutes","5 to 15 minutes","1 minute"],
    answer:2, domain:"SC" },
  { q:"After an accidental needlestick, the phlebotomist should seek medical care within:",
    choices:["1 hour","6 hours","24 hours","1 week"],
    answer:2, domain:"SC" },
  { q:"The first-aid response for a patient experiencing a seizure is to:",
    choices:["Restrain the patient to stop convulsions","Place something in the patient’s mouth","Stop the procedure, guide the patient to the floor, and place on side","Finish the collection quickly"],
    answer:2, domain:"SC" },
  { q:"The first-aid treatment for a hematoma forming during a draw is to:",
    choices:["Continue drawing to finish the tube","Stop the procedure and apply pressure for at least 5 minutes","Massage the area","Apply heat"],
    answer:1, domain:"SC" },
  { q:"The adult CPR compression-to-breath ratio is:",
    choices:["15:2","30:2","15:1","30:1"],
    answer:1, domain:"SC" },
  { q:"When performing CPR on an infant, chest compressions should be delivered using:",
    choices:["The heel of one hand","Both thumbs on the center of the chest","Both palms stacked","One finger"],
    answer:1, domain:"SC" },
  { q:"Incident reports (for example, after a needlestick) are:",
    choices:["Public records anyone can view","Confidential documents describing what occurred, actions taken, and corrective actions","Required only if the patient was injured","Optional in most settings"],
    answer:1, domain:"SC" },
  { q:"Patient documentation in the medical record must always be:",
    choices:["Subjective and emotional","Factual and objective","Written in medical jargon the patient will not understand","Signed by the patient"],
    answer:1, domain:"SC" },

  // ========== PATIENT PREPARATION (PP) ==========
  { q:"The communication cycle begins with the:",
    choices:["Recipient’s reply","Sender’s idea or message","Feedback stage","Decoding of the message"],
    answer:1, domain:"PP" },
  { q:"Therapeutic communication is best defined as interaction designed to:",
    choices:["Fill time during a draw","Improve a patient’s comfort, safety, trust, health, and well-being","Deliver test results verbally","Prevent patient questions"],
    answer:1, domain:"PP" },
  { q:"An example of an open-ended question is:",
    choices:["“Does the pain hurt?”","“Are you nervous?”","“Describe the pain for me.”","“Did you eat today?”"],
    answer:2, domain:"PP" },
  { q:"Pace, tone, and volume are elements of:",
    choices:["Nonverbal communication","Verbal communication","Feedback","Encoding"],
    answer:1, domain:"PP" },
  { q:"When communicating with a patient who has a hearing impairment, the phlebotomist should:",
    choices:["Shout to be heard","Face the patient directly, speak clearly, and use a lower vocal pitch","Avoid eye contact","Speak only through an interpreter even for routine questions"],
    answer:1, domain:"PP" },
  { q:"If a deaf patient requests a sign language interpreter, the facility must provide one in compliance with the:",
    choices:["Patients’ Bill of Rights","Americans with Disabilities Act (ADA)","HIPAA Privacy Rule","OSHA Bloodborne Pathogen Standard"],
    answer:1, domain:"PP" },
  { q:"When guiding a visually impaired patient, the phlebotomist should:",
    choices:["Grab the patient’s arm and lead them","Offer the phlebotomist’s arm and verbally describe each step","Push the patient gently from behind","Hand them a map"],
    answer:1, domain:"PP" },
  { q:"When a service animal accompanies a patient, the phlebotomist should:",
    choices:["Pet and talk to the animal to help the patient relax","Remember the animal is working and should not be distracted","Ask the patient to leave the animal outside","Remove the animal from the room"],
    answer:1, domain:"PP" },
  { q:"When starting a conversation with an older adult patient, the phlebotomist should:",
    choices:["Automatically raise their voice","Speak in their usual tone unless the patient indicates hearing loss","Assume the patient cannot hear","Avoid eye contact to show respect"],
    answer:1, domain:"PP" },
  { q:"Patients should be identified by at least two identifiers such as:",
    choices:["Room number and bed number","Full name and date of birth","Social Security number only","Diagnosis and provider name"],
    answer:1, domain:"PP" },
  { q:"Common specimens a phlebotomist may collect or instruct patients to collect include:",
    choices:["Urine, stool, sputum, and semen","CSF and bone marrow","Only blood","Only urine"],
    answer:0, domain:"PP" },
  { q:"The typical volume for a random urine specimen is:",
    choices:["10 mL","30 to 60 mL","200 mL","500 mL"],
    answer:1, domain:"PP" },
  { q:"A first-morning urine specimen is typically chosen because it is:",
    choices:["Diluted","More concentrated, with a higher specific gravity","Warmer","Easier to collect"],
    answer:1, domain:"PP" },
  { q:"For a female clean-catch (midstream) urine collection, the patient should be instructed to:",
    choices:["Wipe from back to front","Separate the labia and wipe each side front to back using a fresh antiseptic wipe","Skip cleansing","Use soap and water only"],
    answer:1, domain:"PP" },
  { q:"For a male clean-catch (midstream) urine, the patient should be instructed to:",
    choices:["Collect the first stream only","Clean from the meatus outward in a circular motion and (if uncircumcised) retract the foreskin","Avoid cleansing","Collect urine in a non-sterile cup"],
    answer:1, domain:"PP" },
  { q:"The amount of urine required for a clean-catch collection is approximately:",
    choices:["5 to 10 mL","30 to 100 mL","200 to 300 mL","All available urine"],
    answer:1, domain:"PP" },
  { q:"The typical container size used for a 24-hour urine collection is approximately:",
    choices:["100 mL","500 mL","3,000 mL","10 L"],
    answer:2, domain:"PP" },
  { q:"At the start of a 24-hour urine collection, the patient should:",
    choices:["Collect the first morning void","Discard the first morning void, then begin collecting all subsequent urine","Collect only midstream specimens","Collect only the last void of the day"],
    answer:1, domain:"PP" },
  { q:"If any urine is accidentally passed into the toilet during a 24-hour collection, the correct action is to:",
    choices:["Estimate the lost volume","Continue; small losses do not matter","Restart the 24-hour collection","Add tap water to make up the volume"],
    answer:2, domain:"PP" },
  { q:"During a 24-hour urine collection, the specimen should be stored:",
    choices:["At room temperature","Warmed in a heat block","Refrigerated or on ice","In direct sunlight"],
    answer:2, domain:"PP" },
  { q:"The expected pH range on a urine reagent strip is approximately:",
    choices:["1 to 3","5 to 7","8 to 10","12 to 14"],
    answer:1, domain:"PP" },
  { q:"Normal urine specific gravity typically falls between:",
    choices:["0.900 and 1.000","1.003 and 1.030","2.000 and 3.000","5.000 and 6.000"],
    answer:1, domain:"PP" },
  { q:"Glucose in a urine sample on a reagent strip may indicate:",
    choices:["Normal hydration","Diabetes","Pregnancy","Dehydration only"],
    answer:1, domain:"PP" },
  { q:"The presence of ketones in urine may be caused by all of the following EXCEPT:",
    choices:["Diabetes","Fasting","Excessive vomiting","Overhydration"],
    answer:3, domain:"PP" },
  { q:"White blood cells and nitrites in urine typically suggest:",
    choices:["Dehydration","An infection","Liver disease","Normal findings"],
    answer:1, domain:"PP" },
  { q:"The fecal occult blood test (FOBT) is used to detect:",
    choices:["Parasites in stool","Hidden (occult) blood in stool","Bacterial growth","Sputum pathogens"],
    answer:1, domain:"PP" },
  { q:"For 3 days before FOBT collection, patients should avoid:",
    choices:["Water and electrolyte drinks","Red meat, citrus fruits, raw vegetables, vitamin C, and aspirin","All food","Dairy only"],
    answer:1, domain:"PP" },
  { q:"Stool samples collected for parasite testing should be:",
    choices:["Refrigerated for 24 hours","Taken to the lab immediately and not refrigerated","Frozen","Placed in formalin only"],
    answer:1, domain:"PP" },
  { q:"For the most accurate sputum culture, the patient should collect the sample:",
    choices:["Immediately after eating","Early in the morning before eating or drinking","After using mouthwash","Any time of day"],
    answer:1, domain:"PP" },
  { q:"The typical amount of sputum needed for a culture is:",
    choices:["A few drops","1 to 2 teaspoons","100 mL","Half a cup"],
    answer:1, domain:"PP" },
  { q:"A semen specimen for analysis should be delivered to the laboratory, ideally:",
    choices:["Within 1 hour of collection, kept warm","Within 24 hours, refrigerated","Frozen immediately","At the next business day"],
    answer:0, domain:"PP" },

  // ========== ROUTINE COLLECTIONS (RC) ==========
  { q:"Routine venipunctures are typically performed using which blood collection system?",
    choices:["Syringe only","Evacuated tube system (ETS)","Butterfly only","Catheter draws"],
    answer:1, domain:"RC" },
  { q:"A tourniquet should be applied how far above the venipuncture site?",
    choices:["1 inch","3 to 4 inches","6 to 8 inches","At the wrist"],
    answer:1, domain:"RC" },
  { q:"A tourniquet should remain in place for no longer than:",
    choices:["30 seconds","1 minute","3 minutes","5 minutes"],
    answer:1, domain:"RC" },
  { q:"Prolonged tourniquet application can cause:",
    choices:["Hemodilution","Hemoconcentration","Hemolysis of only platelets","Clot formation in the tube only"],
    answer:1, domain:"RC" },
  { q:"Hemoconcentration is defined as:",
    choices:["Thin, diluted blood","Excess of blood accumulated in an area of the body","Clot formation in the needle","Low red cell count"],
    answer:1, domain:"RC" },
  { q:"If a blood pressure cuff is used in place of a tourniquet, it should be inflated to approximately:",
    choices:["20 mm Hg","40 mm Hg","80 mm Hg","120 mm Hg"],
    answer:1, domain:"RC" },
  { q:"The typical needle gauge range for routine adult venipuncture is:",
    choices:["16 to 18","21 to 23","25 to 27","28 to 30"],
    answer:1, domain:"RC" },
  { q:"With needle gauges, the smaller the gauge number, the:",
    choices:["Smaller the needle diameter","Larger the needle diameter","Shorter the needle","Weaker the vacuum"],
    answer:1, domain:"RC" },
  { q:"The first-choice vein for venipuncture in the antecubital region is the:",
    choices:["Cephalic","Basilic","Median cubital","Radial"],
    answer:2, domain:"RC" },
  { q:"The second-choice vein for venipuncture in the antecubital region is the:",
    choices:["Basilic","Cephalic","Brachial","Median nerve"],
    answer:1, domain:"RC" },
  { q:"The basilic vein is considered the LAST choice because it:",
    choices:["Is too small to find","Lies close to the median nerve and brachial artery and rolls easily","Is only present in some patients","Is in the hand"],
    answer:1, domain:"RC" },
  { q:"The alcohol most commonly used for routine venipuncture site cleansing is:",
    choices:["50% ethanol","70% isopropyl or ethyl alcohol","100% methanol","Benzalkonium chloride"],
    answer:1, domain:"RC" },
  { q:"For blood alcohol specimens, which cleanser must be used?",
    choices:["70% isopropyl alcohol","Non-alcohol-based cleanser","Any alcohol pad","Chlorhexidine gluconate only"],
    answer:1, domain:"RC" },
  { q:"Cotton balls should NOT be used at the venipuncture site because they can:",
    choices:["Dissolve in blood","Rip off a scab or leave fibers on the insertion site","Cause allergic reactions in all patients","Interfere with lab results"],
    answer:1, domain:"RC" },
  { q:"When cleansing the venipuncture site with alcohol, you should:",
    choices:["Blow or fan the area dry","Allow it to air dry for 30 seconds to 1 minute","Wipe it off immediately with gauze","Reapply alcohol if dry"],
    answer:1, domain:"RC" },
  { q:"The correct needle insertion angle for a routine venipuncture is:",
    choices:["5 degrees or less","15 to 30 degrees","45 degrees","90 degrees"],
    answer:1, domain:"RC" },
  { q:"When inserting the needle, the bevel should be:",
    choices:["Facing down","Facing up","Facing sideways","Any direction"],
    answer:1, domain:"RC" },
  { q:"The target “lumen” of a vein refers to the:",
    choices:["Outer wall of the vein","Middle (inside) of the vein","Valve area","Branch of the vein"],
    answer:1, domain:"RC" },
  { q:"While palpating, if the phlebotomist feels a pulse, they are palpating a(n):",
    choices:["Tendon","Vein","Artery","Nerve"],
    answer:2, domain:"RC" },

function uuid() {
  // Short time-based id
  const d = new Date();
  const pad = (n, l=2) => String(n).padStart(l, '0');
  return `T${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}-${Math.random().toString(36).slice(2,6)}`;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function hashQ(text) {
  let h = 2166136261;
  for (let i = 0; i < text.length; i++) {
    h ^= text.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function loadSeen() {
  try { return new Set(JSON.parse(localStorage.getItem(SEEN_KEY) || '[]')); }
  catch { return new Set(); }
}
function saveSeen(set) {
  localStorage.setItem(SEEN_KEY, JSON.stringify(Array.from(set)));
}
function markSeen(questions) {
  const s = loadSeen();
  questions.forEach(q => s.add(hashQ(q.q)));
  saveSeen(s);
}

function getCoverage() {
  const bankHashes = QUESTIONS.map(q => hashQ(q.q));
  const bankSet = new Set(bankHashes);
  const seen = loadSeen();
  let seenInBank = 0;
  seen.forEach(h => { if (bankSet.has(h)) seenInBank++; });
  const total = QUESTIONS.length;
  return { seen: seenInBank, total, remaining: Math.max(0, total - seenInBank), done: seenInBank >= total };
}

function renderCoverage() {
  const c = getCoverage();
  if (c.done) {
    coverageEl.className = 'coverage done';
    coverageEl.innerHTML = `
      <div class="cov-text">
        <strong>Completed!</strong> You've seen all <strong>${c.total}</strong> questions in this bank — great work.
      </div>
      <button class="link-btn" id="resetCovBtn">Reset coverage</button>`;
  } else {
    coverageEl.className = 'coverage';
    const pct = Math.round(100 * c.seen / c.total);
    coverageEl.innerHTML = `
      <div class="cov-text">
        Progress: <strong>${c.seen}</strong> of <strong>${c.total}</strong> questions seen (${pct}%) &middot; <strong>${c.remaining}</strong> remaining
      </div>
      <button class="link-btn" id="resetCovBtn">Reset</button>`;
  }
  const btn = document.getElementById('resetCovBtn');
  if (btn) btn.addEventListener('click', () => {
    if (!confirm('Reset question coverage? Past Tests are kept — this only clears the "seen" tracker so you can go through all questions fresh.')) return;
    saveSeen(new Set());
    renderCoverage();
  });
}

function pickRandom(n) {
  const take = Math.min(n, QUESTIONS.length);
  const seen = loadSeen();
  const unseen = QUESTIONS.filter(q => !seen.has(hashQ(q.q)));
  const already = QUESTIONS.filter(q => seen.has(hashQ(q.q)));
  const picked = shuffle(unseen).slice(0, take);
  if (picked.length < take) {
    picked.push(...shuffle(already).slice(0, take - picked.length));
  }
  return shuffle(picked);
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); }
  catch { return []; }
}

function saveHistory(list) {
  // Cap at 50 to keep storage small
  const capped = list.slice(0, 50);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(capped));
}

function upsertHistory(test) {
  const list = loadHistory();
  const idx = list.findIndex(t => t.id === test.id);
  if (idx >= 0) list[idx] = test;
  else list.unshift(test); // newest first
  saveHistory(list);
}

function saveCurrent() {
  if (currentTest) localStorage.setItem(CURRENT_KEY, JSON.stringify(currentTest));
}

function loadCurrent() {
  try { return JSON.parse(localStorage.getItem(CURRENT_KEY) || 'null'); }
  catch { return null; }
}

function domainName(code) {
  return {
    SC: "Safety & Compliance",
    PP: "Patient Prep",
    RC: "Routine Collections",
    SP: "Special Collections",
    PR: "Processing"
  }[code] || code;
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderTest(readOnly=false) {
  if (!currentTest) {
    main.innerHTML = '<div class="empty">Click <b>New Test</b> to begin a 25-question practice set.</div>';
    testIdLabel.textContent = '';
    return;
  }
  const scoreHtml = currentTest.graded ? renderScoreCard(currentTest) : '';
  let html = scoreHtml;
  currentTest.questions.forEach((item, idx) => {
    const userAns = currentTest.answers[idx];
    html += `<div class="question" data-idx="${idx}">
      <div class="q-header">
        <div class="q-num">${idx + 1}.</div>
        <div class="q-text">${escapeHtml(item.q)}</div>
      </div>
      <div class="options">
        ${item.choices.map((c, i) => {
          const checked = userAns === i ? 'checked' : '';
          const disabled = (readOnly || currentTest.graded) ? 'disabled' : '';
          let cls = 'option';
          if (currentTest.graded) {
            if (i === item.answer && i === userAns) cls += ' correct';
            else if (i === item.answer) cls += ' correct-missed';
            else if (i === userAns) cls += ' wrong';
          }
          return `<label class="${cls}" data-choice="${i}">
            <input type="radio" name="q${idx}" value="${i}" ${checked} ${disabled}>
            <b>${String.fromCharCode(65 + i)}.</b> ${escapeHtml(c)}
          </label>`;
        }).join('')}
      </div>
      <div class="domain">Domain: ${domainName(item.domain)}${
        currentTest.graded
          ? ` &middot; ${userAns === item.answer ? '<span style="color:#1e8449;font-weight:700;">Correct</span>' : (userAns == null ? '<span style="color:#6b7280;font-weight:700;">Skipped</span>' : '<span style="color:#c0392b;font-weight:700;">Incorrect</span>')}`
          : ''
      }</div>
    </div>`;
  });
  main.innerHTML = html;
  updateProgress();
  main.querySelectorAll('input[type="radio"]').forEach(r => {
    r.addEventListener('change', (e) => {
      const name = e.target.name; // qIDX
      const idx = parseInt(name.slice(1), 10);
      currentTest.answers[idx] = parseInt(e.target.value, 10);
      saveCurrent();
      updateProgress();
    });
  });
  testIdLabel.textContent = `Test ID: ${currentTest.id} • ${new Date(currentTest.timestamp).toLocaleString()}`;
}

function renderScoreCard(t) {
  const domainStats = {};
  t.questions.forEach((item, idx) => {
    if (!domainStats[item.domain]) domainStats[item.domain] = { right: 0, total: 0 };
    domainStats[item.domain].total++;
    if (t.answers[idx] === item.answer) domainStats[item.domain].right++;
  });
  const pass = t.pct >= 75;
  return `
    <div class="score-card">
      <div style="font-size:14px; opacity:0.85;">YOUR SCORE</div>
      <div class="big ${pass ? 'pass' : 'fail'}">${t.score} / ${t.total} &nbsp; (${t.pct}%)</div>
      <div>${pass ? 'Pass — keep practicing!' : 'Below 75% — review the missed items.'}</div>
      <div class="domain-breakdown">
        ${Object.entries(domainStats).map(([d, s]) => `
          <div class="domain-stat">
            <div>${domainName(d)}</div>
            <div class="num">${s.right}/${s.total}</div>
          </div>
        `).join('')}
      </div>
    </div>`;
}

function updateProgress() {
  if (!currentTest) { progressEl.textContent = ''; return; }
  const answered = currentTest.answers.filter(a => a != null).length;
  if (currentTest.graded) {
    progressEl.textContent = `Graded: ${currentTest.score}/${currentTest.total} (${currentTest.pct}%)`;
  } else {
    progressEl.textContent = `Answered ${answered} / ${currentTest.total}`;
  }
}

function startNewTest() {
  const picked = pickRandom(TARGET_COUNT);
  markSeen(picked);
  renderCoverage();
  currentTest = {
    id: uuid(),
    timestamp: Date.now(),
    questions: picked,
    answers: picked.map(() => null),
    graded: false,
    score: 0,
    total: picked.length,
    pct: 0
  };
  saveCurrent();
  upsertHistory(currentTest);
  renderTest();
  revealBtn.disabled = true;
  submitBtn.disabled = false;
  downloadBtn.disabled = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function gradeCurrent() {
  if (!currentTest) return;
  let correct = 0;
  currentTest.questions.forEach((item, idx) => {
    if (currentTest.answers[idx] === item.answer) correct++;
  });
  currentTest.score = correct;
  currentTest.pct = Math.round((correct / currentTest.total) * 100);
  currentTest.graded = true;
  saveCurrent();
  upsertHistory(currentTest);
  renderTest();
  submitBtn.disabled = true;
  revealBtn.disabled = false;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showAnswerKey() {
  if (!currentTest) return;
  let html = '<div class="score-card"><div style="font-size:18px; font-weight:700;">Answer Key</div></div>';
  html += '<ol style="line-height:1.8;">';
  currentTest.questions.forEach(item => {
    const letter = String.fromCharCode(65 + item.answer);
    html += `<li style="margin-bottom:10px;"><b>${escapeHtml(item.q)}</b><br>
      <span style="color:#1e8449;"><b>Answer: ${letter}.</b> ${escapeHtml(item.choices[item.answer])}</span>
      <div class="domain" style="margin-left:0;">Domain: ${domainName(item.domain)}</div></li>`;
  });
  html += '</ol>';
  html += '<button class="secondary" onclick="renderTest()">← Back to test view</button>';
  main.innerHTML = html;
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function downloadTest(test) {
  if (!test) return;
  const ts = new Date(test.timestamp);
  const header = `NHA CPT Baseline Practice Test\nTest ID: ${test.id}\nStarted: ${ts.toLocaleString()}\nStatus: ${test.graded ? `Graded ${test.score}/${test.total} (${test.pct}%)` : 'Not graded'}\n\n`;
  const body = test.questions.map((item, idx) => {
    const letters = ['A','B','C','D','E','F'];
    const choices = item.choices.map((c, i) => `  ${letters[i]}. ${c}`).join('\n');
    const yourAns = test.answers[idx] != null ? letters[test.answers[idx]] : '(skipped)';
    const correctAns = letters[item.answer];
    const mark = test.graded ? (test.answers[idx] === item.answer ? '[Correct]' : '[Incorrect]') : '';
    return `Q${idx+1} [${domainName(item.domain)}] ${mark}\n${item.q}\n${choices}\nYour answer: ${yourAns}\nCorrect answer: ${correctAns}. ${item.choices[item.answer]}\n`;
  }).join('\n');
  const blob = new Blob([header + body], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${test.id}.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderHistory() {
  const list = loadHistory();
  if (!list.length) {
    main.innerHTML = `<h2 style="margin-top:0;">Past Tests</h2>
      <div class="empty">No past tests yet. Click <b>New Test</b> to begin.</div>
      <button class="secondary" onclick="renderTest()">← Back</button>`;
    return;
  }
  let html = `<h2 style="margin-top:0;">Past Tests <span style="font-size:13px; color:#6b7280; font-weight:400;">(${list.length} saved)</span></h2>`;
  html += '<ul class="history-list">';
  list.forEach(t => {
    const ts = new Date(t.timestamp);
    let scoreCls = 'ungraded';
    let scoreTxt = 'Not graded';
    if (t.graded) {
      scoreCls = t.pct >= 75 ? 'pass' : 'fail';
      scoreTxt = `${t.score}/${t.total} (${t.pct}%)`;
    }
    html += `<li class="history-item">
      <div>
        <div class="hi-title">${escapeHtml(t.id)}</div>
        <div class="hi-meta">${ts.toLocaleString()} &middot; ${t.total} questions</div>
      </div>
      <div style="display:flex; gap:10px; align-items:center;">
        <span class="hi-score ${scoreCls}">${scoreTxt}</span>
        <div class="history-actions">
          <button class="secondary" data-act="open" data-id="${t.id}">Open</button>
          <button class="ghost" data-act="download" data-id="${t.id}">Download</button>
          <button class="ghost" data-act="delete" data-id="${t.id}" style="color:#c0392b; border-color:#c0392b;">Delete</button>
        </div>
      </div>
    </li>`;
  });
  html += '</ul>';
  html += '<div style="margin-top:16px;"><button class="secondary" id="historyBack">← Back to current test</button> <button class="ghost" id="historyClear" style="color:#c0392b; border-color:#c0392b;">Clear all history</button></div>';
  main.innerHTML = html;

  main.querySelectorAll('button[data-act]').forEach(btn => {
    btn.addEventListener('click', () => {
      const id = btn.dataset.id;
      const list = loadHistory();
      const t = list.find(x => x.id === id);
      if (!t) return;
      if (btn.dataset.act === 'open') {
        currentTest = t;
        saveCurrent();
        renderTest();
        submitBtn.disabled = t.graded;
        revealBtn.disabled = false;
        downloadBtn.disabled = false;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (btn.dataset.act === 'download') {
        downloadTest(t);
      } else if (btn.dataset.act === 'delete') {
        if (!confirm(`Delete test ${id}?`)) return;
        const newList = list.filter(x => x.id !== id);
        saveHistory(newList);
        renderHistory();
      }
    });
  });
  document.getElementById('historyBack').addEventListener('click', renderTest);
  document.getElementById('historyClear').addEventListener('click', () => {
    if (!confirm('Delete ALL saved past tests? This cannot be undone.')) return;
    saveHistory([]);
    renderHistory();
  });
}

newBtn.addEventListener('click', () => {
  if (currentTest && !currentTest.graded && currentTest.answers.some(a => a != null)) {
    if (!confirm('Start a new test? Your current unsaved answers will be lost (the test will still appear in Past Tests).')) return;
  }
  startNewTest();
});

submitBtn.addEventListener('click', () => {
  if (!currentTest) { alert('Click "New Test" to start first.'); return; }
  if (currentTest.graded) return;
  const answered = currentTest.answers.filter(a => a != null).length;
  if (answered < currentTest.total) {
    if (!confirm(`You answered ${answered} of ${currentTest.total}. Grade anyway?`)) return;
  }
  gradeCurrent();
});

revealBtn.addEventListener('click', showAnswerKey);
downloadBtn.addEventListener('click', () => downloadTest(currentTest));
historyBtn.addEventListener('click', renderHistory);

function mergeHistory(incoming) {
  if (!Array.isArray(incoming)) return 0;
  const existing = loadHistory();
  const map = new Map();
  // Prefer whichever record for the same id is newer (or graded over ungraded)
  const upsert = (t) => {
    if (!t || !t.id) return;
    const prev = map.get(t.id);
    if (!prev) { map.set(t.id, t); return; }
    const newer = (t.timestamp || 0) >= (prev.timestamp || 0);
    const upgradeToGraded = t.graded && !prev.graded;
    if (upgradeToGraded || newer) map.set(t.id, t);
  };
  existing.forEach(upsert);
  let added = 0;
  incoming.forEach(t => {
    const prev = map.get(t && t.id);
    upsert(t);
    if (map.get(t.id) !== prev) added++;
  });
  const merged = Array.from(map.values()).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
  saveHistory(merged);
  return added;
}

function exportAll() {
  const list = loadHistory();
  if (!list.length) { alert('No history to export yet. Take a test first.'); return; }
  const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = EXPORT_FILENAME;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function importHistoryFile() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const incoming = JSON.parse(text);
      if (!Array.isArray(incoming)) { alert('Invalid file: expected an array of tests.'); return; }
      mergeHistory(incoming);
      alert(`Imported ${incoming.length} entries. Open Past Tests to review.`);
      renderHistory();
    } catch (err) {
      alert('Import failed: ' + err.message);
    }
  });
  input.click();
}

async function tryLoadFromGit() {
  try {
    const resp = await fetch(HISTORY_FILE, { cache: 'no-cache' });
    if (!resp.ok) return 0;
    const remote = await resp.json();
    if (!Array.isArray(remote) || !remote.length) return 0;
    return mergeHistory(remote);
  } catch (e) {
    return 0;
  }
}

exportBtn.addEventListener('click', exportAll);
importBtn.addEventListener('click', importHistoryFile);

document.addEventListener('DOMContentLoaded', async () => {
  await tryLoadFromGit();
  renderCoverage();
  const saved = loadCurrent();
  if (saved && saved.id) {
    currentTest = saved;
    renderTest();
    submitBtn.disabled = currentTest.graded;
    revealBtn.disabled = !currentTest.graded;
    downloadBtn.disabled = false;
  }
  const history = loadHistory();
  if (history.length) {
    const past = history.length;
    const extra = currentTest ? '' : ` — click Past Tests to review.`;
    progressEl.textContent = `${past} saved test${past === 1 ? '' : 's'} in history${extra}`;
    if (currentTest) updateProgress();
  }
});
</script>
